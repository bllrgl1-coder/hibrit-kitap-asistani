name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Latest Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Platform & Remove Line 248 Tooltip
        run: |
          # library_screen.dart 248. satirdaki TextButton.icon tooltip parametresini kaldir
          sed -i '248d' lib/screens/library_screen.dart
          sed -i 's/\.withValues(alpha: /\.withOpacity(/g' lib/screens/*.dart

          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt /tmp/MainActivity.kt.bak
          rm -rf android test
          flutter create . --platforms=android --org com.bilal --project-name hibrit_kitap_asistani
          rm -rf test
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$f"
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$f"
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f"
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$f"
            fi
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibrit-kitap-asistani-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
