name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform & Fix Kotlin/SDK Versions
        run: |
          # 1. Flutter 3.24 uyumlulugu ve kararli flutter_tts 4.0.2 surumu
          sed -i 's/\.withValues(alpha: /\.withOpacity(/g' lib/screens/*.dart
          sed -i 's/flutter_tts: \^4.0.2/flutter_tts: 4.0.2/g' pubspec.yaml
          # 2. AndroidManifest ve MainActivity yedegini al
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt /tmp/MainActivity.kt.bak
          rm -rf android test
          flutter create . --platforms=android --org com.bilal --project-name hibrit_kitap_asistani
          rm -rf test
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt
          # 3. Kotlin surumunu 2.0.20, AGP surumunu 8.5.0 ve compileSdk=35 / minSdk=23 yap
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.20"/g' android/settings.gradle
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.5.0"/g' android/settings.gradle
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibrit-kitap-asistani-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
