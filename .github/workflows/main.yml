name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Latest Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Platform (SDK 36 & Kotlin 2.2.20)
        run: |
          sed -i 's/\.withValues(alpha: /\.withOpacity(/g' lib/screens/*.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt /tmp/MainActivity.kt.bak
          rm -rf android test
          flutter create . --platforms=android --org com.bilal --project-name hibrit_kitap_asistani
          rm -rf test
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/bilal/hibrit_kitap_asistani/MainActivity.kt

          # Hem Groovy (.gradle) hem Kotlin DSL (.gradle.kts) icin compileSdk = 36 ve minSdk = 24 yap
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$f"
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$f"
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f"
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$f"
            fi
          done

          # Kotlin metadata uyumsuzlugunu tamamen onlemek icin Kotlin 2.2.20 ayarla
          for s in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$s" ]; then
              sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' "$s"
              sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' "$s"
            fi
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibrit-kitap-asistani-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
